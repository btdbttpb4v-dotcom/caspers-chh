<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Caspers Häst Hjälp AI
</title>


<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">


</head>


<body>


<div class="container">


<header>

<h1>
🐎 Caspers Häst Hjälp AI
</h1>


<p>
Din personliga racingassistent
</p>


</header>




<section class="card">


<h2>
🏇 Välj spel
</h2>


<button class="game-button"
onclick="chooseGame('V85')">

V85

</button>


<button class="game-button"
onclick="chooseGame('V86')">

V86

</button>


<button class="game-button"
onclick="chooseGame('GS75')">

Grand Slam 75

</button>


<button class="game-button"
onclick="chooseGame('V64')">

V64

</button>


<button class="game-button"
onclick="chooseGame('V65')">

V65

</button>


<button class="game-button"
onclick="chooseGame('V4')">

V4

</button>


<button class="game-button"
onclick="chooseGame('V5')">

V5

</button>



<div id="selectedGame">

Inget spel valt ännu

</div>


</section>






<section class="card">


<h2>
💰 Spelbudget
</h2>


<input

id="budget"

type="number"

placeholder="Skriv budget i kr">


<button class="main-button"

onclick="setBudget()">

Spara budget

</button>


<div id="budgetResult">

</div>


</section>







<section class="card">


<h2>
🤖 CHH AI Analys
</h2>


<p>

AI analyserar form, kusk, tränare,
spår, distans och klass.

</p>



<button class="main-button"

onclick="startAnalysis()">


Starta analys


</button>



<div id="status">

CHH AI väntar...

</div>



</section>








<section class="result">


<div id="systemResult">


🏆 Ditt färdiga systemförslag visas här


</div>


</section>






</div>





<script src="app.js"></script>


</body>


</html>
